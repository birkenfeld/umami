[project]
name = "umami-gui"
version = "0.1.0"
description = "Live histogram viewer and debugging tool for UMAMI shared-memory output"
requires-python = ">=3.10"
dependencies = [
    "cffi>=1.16",
    "numpy>=1.26",
    "pyqtgraph>=0.13",
    "pyqt6>=6.6",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.uv]
package = false
