[build-system]
requires = ["setuptools>=61", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "umami-gui"
dynamic = ["version"]
description = "Live histogram viewer and debugging tool for UMAMI shared-memory output"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pyqtgraph>=0.13",
    "pyqt6>=6.6",
    "umami-client",
]

[project.scripts]
umami-gui = "umami_gui.app:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "setuptools_scm>=8",
]

[tool.uv.sources]
# builds the extension in place via maturin; not a real distribution
# constraint, so it doesn't land in umami-gui's own published metadata
umami-client = { path = "umami_client", editable = true }

[tool.setuptools]
# explicit, not auto-discovered (Rust src/ is not a package)
packages = ["umami_gui", "umami_gui.icons"]

[tool.setuptools.package-data]
umami_gui = ["icons/*.svg"]

[tool.setuptools_scm]

[tool.ruff]
exclude = ["umami_det.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN", "D1", "D203", "D213", "EM1", "FBT", "G004",
          "PERF203", "PLR2004", "S603", "TD", "TRY003", "TRY400"]
pylint.max-args = 10
flake8-copyright.notice-rgx = "(?i)see README and LICENSE"
flake8-quotes.inline-quotes = "single"
flake8-quotes.multiline-quotes = "single"

[tool.ruff.lint.per-file-ignores]
# a CLI tool's whole job is printing progress to the terminal
"pulser_test.py" = ["T20"]
