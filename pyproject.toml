[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "umami-gui"
version = "0.1.0"
description = "Live histogram viewer and debugging tool for UMAMI shared-memory output"
requires-python = ">=3.10"
dependencies = [
    "cffi>=1.16",
    "numpy>=1.26",
    "pyqtgraph>=0.13",
    "pyqt6>=6.6",
]

[project.scripts]
umami-gui = "umami_gui.app:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.setuptools]
# explicit, not auto-discovered -- the Rust crate's own src/ directory at
# the repo root would otherwise confuse setuptools' auto-discovery into
# mistaking it for a second (invalid) Python src-layout
packages = ["umami_gui"]
