[process_modes]
default = "std"
std = { type = "histo_std", bin_x = 1, bin_y = 1 }
tof = { type = "histo_tof", bin_x = 1, bin_y = 1 }

[histogram]
nx = 144
ny = 256
max_nt = 1024

[outputs]
diag = { type = "diag", print_every = 10000000 }
