[input_recipes]
ev = { type = "canon", reso = 128 }

[inputs]
neu = { recipe = "ev", type = "canon", source = "data/canon/test.dump", channel_offset = 0 }

[process_modes]
default = "std"
std = { type = "histo_std", bin_x = 1, bin_y = 1 }

[histogram]
nx = 8
ny = 128
max_nt = 1

[outputs.aux]
type = "aux_histo"

[[outputs.aux.histos]]
name = "x_spectrum"
filter = "evtype == neutron"
x = { expr = "x", bins = 8, min = 0, max = 7 }

[[outputs.aux.histos]]
name = "y_spectrum"
x = { expr = "y", bins = 128, min = 0, max = 127 }

[[outputs.aux.histos]]
name = "x_vs_y"
x = { expr = "x", bins = 8, min = 0, max = 7 }
y = { expr = "y", bins = 128, min = 0, max = 127 }
