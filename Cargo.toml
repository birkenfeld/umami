[workspace]

[package]
name = "umami"
version = "0.1.0"
edition = "2024"
authors = ["Georg Brandl <g.brandl@fz-juelich.de>",
           "Alexander Zaft <a.zaft@fz-juelich.de>"]
license = "GPL-3.0-or-later"
description = "Unified Mechanism for Acquisition of Measured Intensity"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.102"
bitflag-attr = "0.13.0"
byteorder = "1.5.0"
clap = { version = "4.5.60", features = ["derive"] }
flume = { version = "0.12.0", default-features = false }
hdf5 = { package = "hdf5-metno", version = "0.13.0" }
internment = { version = "0.8.6", features = ["serde"] }
itertools = "0.15.0"
jemallocator = "0.5.4"
jiff = "0.2.21"
nix = { version = "0.31.2", features = ["fs", "mman"] }
num_enum = "0.7.5"
rkyv = "0.8.15"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
signal-hook = "0.4.3"
thiserror = "2.0.18"
toml = "1.0.3"
uds = "0.4.2"
zerocopy = { version = "0.8.39", features = ["derive"] }

[dependencies.umami-derive]
version = "0.1"
path = "src/derive"

[features]
trace = []
