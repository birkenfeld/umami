[workspace]
members = ["umami_client"]

[workspace.package]
# global definitions that can be reused throughout the workspace
version = "0.9.0"
edition = "2024"
authors = ["Georg Brandl <g.brandl@fz-juelich.de>",
           "Alexander Zaft <a.zaft@fz-juelich.de>",
           "Enrico Faulhaber <enrico.faulhaber@frm2.tum.de>"]
license = "GPL-3.0-or-later"
rust-version = "1.88"

[package]
name = "umami"
description = "Unified Mechanism for Acquisition of Measured Intensity"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.102"
bitflag-attr = "0.14.0"
byteorder = "1.5.0"
clap = { version = "4.5.60", features = ["derive"] }
flume = { version = "0.12.0", default-features = false }
hdf5 = { package = "hdf5-metno", version = "0.14.0", optional = true }
internment = { version = "0.8.6", features = ["serde"] }
itertools = "0.15.0"
jemallocator = "0.5.4"
jiff = "0.2.21"
nix = { version = "0.31.2", features = ["fs", "mman"] }
num_enum = "0.7.5"
rkyv = "0.8.15"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
signal-hook = "0.4.3"
thiserror = "2.0.18"
toml = "1.0.3"
toml_edit = { version = "0.25.13", features = ["serde"] }
uds = "0.4.2"
zerocopy = { version = "0.8.39", features = ["derive"] }

[dependencies.umami-derive]
version = "0.1"
path = "src/derive"

[dev-dependencies]
flate2 = "1.1.9"
ureq = "3.3.0"

[features]
default = ["hdf5"]
trace = []
profile = []
hdf5 = ["dep:hdf5"]
# Jumiom PSD acquisition: links against libjumpsd.so (see build.rs), requires
# the driver to be useful.
jumiom = []
