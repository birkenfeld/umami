[package]
name = "umami"
version = "0.1.0"
edition = "2024"
authors = ["Georg Brandl <g.brandl@fz-juelich.de>",
           "Alexander Zaft <a.zaft@fz-juelich.de>"]
license = "GPL-3.0-or-later"
description = "Unified Mechanism for Acquisition of Detected Intensity"
rust-version = "1.90"

[dependencies]
anyhow = "1.0.102"
bitflag-attr = "0.13.0"
byteorder = "1.5.0"
clap = { version = "4.5.60", features = ["derive"] }
crossbeam-channel = "0.5.15"
flume = { version = "0.12.0", default-features = false }
itertools = "0.14.0"
jemallocator = "0.5.4"
jiff = "0.2.21"
kanal = { version = "0.1.1", default-features = false }
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "image", "colormaps", "full_palette", "ttf"] }
plotters-bitmap = { version = "0.3.7", default-features = false, features = ["image"] }
rkyv = "0.8.15"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shmem-bind = "0.1.3"
thiserror = "2.0.18"
toml = "1.0.3"
uds = "0.4.2"
zerocopy = { version = "0.8.39", features = ["derive"] }
