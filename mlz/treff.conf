name = "TREFF live"

[input_recipes.pos]
type = "jumiom"
# fpga | linear | distortion | formula0 | formula2
mode = "fpga"
# mode = "distortion" ("Entzerrung") takes extra parameters, all optional
# (cutoff <= 0 disables the radius-cutoff check entirely):
## offset_x = 0.0
## offset_y = 0.0
## factor_x = 1.0
## factor_y = 1.0
## a = 0.0
## b = 0.0
## c = 0.0
## cutoff = 0.0
# limits map in traditional format
limits_file = "/etc/entangle/amp-map.tab"

[inputs.det]
recipe = "pos"
type = "jumiom"
device = 0        # /dev/jumpsd_d0
mode = "tof1"     # tof1 | raw | ramp

[inputs.det.calibration]
thresholds = [8100, 700, 600]
poti = [0, 0, 0, 0]
dac1 = [1020, 1070, 1050, 1100]
dac2 = [0, 0, 0, 0]
pileup = 80

[process_modes]
default = "std"
std = { type = "histo_std", bin_x = 1, bin_y = 1 }

[outputs]
diag = { type = "diag", event_mask = "ALL" }

[outputs.aux]
type = "aux_histo"
enabled = false

[[outputs.aux.histos]]
name = "adc0"
x = { expr = "adc0", bins = 256, min = 0, max = 1023}

[[outputs.aux.histos]]
name = "adc1"
x = { expr = "adc1", bins = 256, min = 0, max = 1023}

[[outputs.aux.histos]]
name = "adc2"
x = { expr = "adc2", bins = 256, min = 0, max = 1023}

[[outputs.aux.histos]]
name = "adc3"
x = { expr = "adc3", bins = 256, min = 0, max = 1023}

[histogram]
nx = 256
ny = 256
max_nt = 1
max_ni = 0
