[package]
name = "umami-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Python bindings for UMAMI's command socket and shared-memory histogram"

[lib]
# cdylib for Python, rlib so cargo can still build and check this
# crate like any other workspace member
name = "umami_client"
crate-type = ["cdylib", "rlib"]

[dependencies]
# omit any additional backend features
umami = { path = "..", default-features = false }
pyo3 = "0.29.2"
pythonize = "0.29.0"
serde_json = "1.0.149"

[features]
# pyo3's "extension-module" assumes libpython is provided by the interpreter
# that loads the .so, and can't be combined with a standalone test binary,
# so make it possible to opt out for testing
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dev-dependencies]
# for testing, we want to initialize the interpreter ourselves
pyo3 = { version = "0.29.2", features = ["auto-initialize"] }
