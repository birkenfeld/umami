  <title
     id="title1">UMAMI logo (pixel colorplot concept, revised)</title>
  <desc
     id="desc1">A noisy pixel grid on a dark background, colored with a blue to yellow to red thermal colormap, where a hot U-shaped region emerges from the noise, with the wordmark UMAMI below in a blue shade from the colormap.</desc>
